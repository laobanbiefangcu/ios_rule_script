#!MANAGED-CONFIG 订阅链接
mixed-port: 7890
allow-lan: true
mode: Rule
log-level: info
ipv6: true                   
tcp-concurrent: true         
global-client-fingerprint: chrome
keep-alive-interval: 30
keep-alive-idle: 600
find-process-mode: strict
geodata-mode: true
geodata-loader: memconservative
geosite-matcher: succinct
profile: { store-selected: true, store-fake-ip: true }
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS:  { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }
  skip-domain: ['+.push.apple.com', 'Mijia Cloud']
hosts:
  hdbits.org: 179.43.168.158
  tracker.hdbits.org: 179.43.168.158
  i.hdbits.org: 179.43.168.158
  t.hdbits.org: 179.43.168.158
  img.hdbits.org: 179.43.168.158
dns:
  enable: true
  ipv6: true
  listen: '0.0.0.0:1053'
  prefer-h3: false
  respect-rules: false       
  use-hosts: true
  use-system-hosts: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  cache-algorithm: arc
  # 解析下面 DoH 服务器自身的域名，必须是国内可直连的明文 IP
  default-nameserver: [223.5.5.5, 119.29.29.29, 182.254.116.116, 114.114.114.114]
  nameserver: ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query']
  # 【关键·勿改】指回本机 DNS 监听口。填外部 DNS 会绕过 hosts 和 fake-ip-filter，
  # 导致 linkcube 那种靠 hosts 映射的机场节点全部解析失败。端口须与 listen 一致。
  proxy-server-nameserver: ['udp://127.0.0.1:1053']
  # 每家机场的节点域名，指回它自己要求的 DNS。新增机场往对应行加后缀即可。
  nameserver-policy:
    '+.eixcloud.com': ['https://zone.rlose.com:39933/api-query', 'https://radar.rlose.com/api-query']
    '+.linkcubecloud.org': [223.5.5.5, 119.29.29.29]
    '+.linkcube-cloud.org': [223.5.5.5, 119.29.29.29]
